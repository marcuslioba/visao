name: Avisos Visão

on:
  schedule:
    # a cada ~10 min entre 07h e 22h (Fortaleza); cada rodada manda o que ocorreu nos ultimos 25 min
    - cron: '3,13,23,33,43,53 0-1,10-23 * * *'
  workflow_dispatch:
    inputs:
      janela:
        description: 'teste = manda 1 aviso agora | resto = avisos que faltam hoje | janela1..4 = faixas do dia'
        type: choice
        default: teste
        options:
          - teste
          - agora
          - resto
          - janela1
          - janela2
          - janela3
          - janela4

jobs:
  avisos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: America/Fortaleza
      VAPID_PUBLIC: BM7AX7EsWPCX4g-lb_LRWtMCGn4LfomC1RB3MmaBbzOBIFfAMUKUQExAneuPxFrKc6l0fV2M62FhjKymwchKPfk
      VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
      SUBSCRIPTION: ${{ secrets.SUBSCRIPTION }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar web-push
        run: npm install --no-save web-push@3
      - name: Definir janela
        run: |
          J="${{ inputs.janela }}"
          if [ -z "$J" ]; then J=agora; fi
          echo "JANELA=$J" >> "$GITHUB_ENV"
      - name: Enviar avisos
        run: node push.js
